name: Foroshino Final Android Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: foroshino-final-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OUTPUT_DIR: ${{ github.workspace }}/final-output
  LOG_DIR: ${{ github.workspace }}/failure-logs
  EXTRACT_DIR: ${{ github.workspace }}/extracted-source

jobs:
  build-apks:
    name: Build Bazaar and Myket APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare clean workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUTPUT_DIR" "$LOG_DIR" "$EXTRACT_DIR"
          mkdir -p "$OUTPUT_DIR" "$LOG_DIR" "$EXTRACT_DIR"

      - name: Find latest project ZIP
        id: latest_zip
        shell: bash
        run: |
          set -Eeuo pipefail

          latest_zip="$({
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' \
              ! -iname '*output*' \
              ! -iname '*artifact*' \
              ! -iname '*error-log*' \
              ! -iname '*failure-log*' \
              -printf '%T@ %p\n'
          } | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [[ -z "$latest_zip" || ! -f "$latest_zip" ]]; then
            echo "No project ZIP was found in the repository root." | tee "$LOG_DIR/01-find-latest-zip.log"
            exit 1
          fi

          echo "Selected ZIP: $latest_zip" | tee "$LOG_DIR/01-find-latest-zip.log"
          echo "path=$latest_zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$latest_zip")" >> "$GITHUB_OUTPUT"

      - name: Extract latest ZIP and detect Flutter project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          unzip -q "${{ steps.latest_zip.outputs.path }}" -d "$EXTRACT_DIR" \
            2>&1 | tee "$LOG_DIR/02-unzip.log"

          project_dir=""
          while IFS= read -r pubspec; do
            candidate="$(dirname "$pubspec")"
            if [[ -d "$candidate/android/app" && -d "$candidate/lib" ]]; then
              project_dir="$candidate"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' | sort)

          if [[ -z "$project_dir" ]]; then
            echo "A valid Flutter Android project was not found inside the selected ZIP." \
              | tee "$LOG_DIR/03-detect-project.log"
            find "$EXTRACT_DIR" -maxdepth 4 -type f | sort \
              >> "$LOG_DIR/03-detect-project.log" || true
            exit 1
          fi

          echo "Flutter project: $project_dir" | tee "$LOG_DIR/03-detect-project.log"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Record tool versions
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "Source ZIP: ${{ steps.latest_zip.outputs.name }}"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            java -version
            echo
            flutter --version
            echo
            dart --version
          } 2>&1 | tee "$LOG_DIR/04-tool-versions.log"

      - name: Restore missing Gradle wrapper files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            temp_dir="$(mktemp -d)"
            flutter create "$temp_dir/wrapper_source" \
              --platforms=android \
              --project-name wrapper_source \
              --org com.example \
              2>&1 | tee "$LOG_DIR/05-wrapper-restore.log"

            mkdir -p android/gradle/wrapper
            cp "$temp_dir/wrapper_source/android/gradle/wrapper/gradle-wrapper.jar" \
              android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$temp_dir"
          else
            echo "Gradle wrapper JAR already exists." | tee "$LOG_DIR/05-wrapper-restore.log"
          fi

          chmod +x android/gradlew

      - name: Resolve Flutter packages
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"
          flutter pub get 2>&1 | tee "$LOG_DIR/06-flutter-pub-get.log"

      - name: Run static analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"

          if [[ -f tool/static_validate.py ]]; then
            python3 tool/static_validate.py \
              2>&1 | tee "$LOG_DIR/07-project-static-validation.log"
          fi

          flutter analyze --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee "$LOG_DIR/08-flutter-analyze.log"

      - name: Run Flutter tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"
          flutter test --reporter expanded \
            2>&1 | tee "$LOG_DIR/09-flutter-test.log"

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"

          full_version="$(awk -F': *' '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '\r[:space:]')"
          version_name="${full_version%%+*}"
          version_code="${full_version##*+}"

          if [[ -z "$full_version" || "$version_name" == "$full_version" ]]; then
            echo "Invalid or missing version field in pubspec.yaml: $full_version" \
              | tee "$LOG_DIR/10-version.log"
            exit 1
          fi

          safe_version="$(printf '%s' "$version_name" | tr -cs 'A-Za-z0-9._-' '-')"

          {
            echo "Full version: $full_version"
            echo "Version name: $version_name"
            echo "Version code: $version_code"
          } | tee "$LOG_DIR/10-version.log"

          echo "full=$full_version" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "safe=$safe_version" >> "$GITHUB_OUTPUT"

      - name: Build Bazaar release APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"

          rm -f build/app/outputs/flutter-apk/*.apk || true
          flutter build apk --release \
            --dart-define=STORE_CHANNEL=bazaar \
            2>&1 | tee "$LOG_DIR/11-build-bazaar.log"

          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "Bazaar APK was not created." | tee -a "$LOG_DIR/11-build-bazaar.log"
            exit 1
          fi

          cp "$source_apk" \
            "$OUTPUT_DIR/Foroshino-Bazaar-v${{ steps.version.outputs.safe }}-${{ steps.version.outputs.code }}.apk"

      - name: Build Myket release APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "${{ steps.project.outputs.dir }}"

          rm -f build/app/outputs/flutter-apk/*.apk || true
          flutter build apk --release \
            --dart-define=STORE_CHANNEL=myket \
            2>&1 | tee "$LOG_DIR/12-build-myket.log"

          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "Myket APK was not created." | tee -a "$LOG_DIR/12-build-myket.log"
            exit 1
          fi

          cp "$source_apk" \
            "$OUTPUT_DIR/Foroshino-Myket-v${{ steps.version.outputs.safe }}-${{ steps.version.outputs.code }}.apk"

      - name: Verify final outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t apk_files < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' | sort)

          if [[ "${#apk_files[@]}" -ne 2 ]]; then
            echo "Expected exactly 2 APK files, found ${#apk_files[@]}." \
              | tee "$LOG_DIR/13-output-verification.log"
            find "$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f\n' \
              >> "$LOG_DIR/13-output-verification.log" || true
            exit 1
          fi

          {
            echo "Exactly two APK files were created:"
            for apk in "${apk_files[@]}"; do
              echo "- $(basename "$apk") ($(stat -c%s "$apk") bytes)"
            done
          } | tee "$LOG_DIR/13-output-verification.log"

      - name: Upload exactly two APK files
        id: upload_apks
        uses: actions/upload-artifact@v4
        with:
          name: foroshino-apks-v${{ steps.version.outputs.safe }}-build-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Delete previous successful APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const currentArtifactId = Number('${{ steps.upload_apks.outputs.artifact-id }}');
            const prefix = 'foroshino-apks-v';

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            let deleted = 0;
            for (const artifact of artifacts) {
              if (
                artifact.name.startsWith(prefix) &&
                Number(artifact.id) !== currentArtifactId
              ) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                core.info(`Deleted old artifact: ${artifact.name} (${artifact.id})`);
              }
            }

            core.info(`Deleted ${deleted} previous Foroshino APK artifact(s).`);

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "$LOG_DIR"

          {
            echo "Foroshino build failed"
            echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run number: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "Selected ZIP: ${{ steps.latest_zip.outputs.name }}"
            echo "Project directory: ${{ steps.project.outputs.dir }}"
          } > "$LOG_DIR/00-failure-summary.txt"

          {
            echo '=== Runner disk ==='
            df -h
            echo
            echo '=== Memory ==='
            free -h
            echo
            echo '=== Java ==='
            java -version
            echo
            echo '=== Flutter doctor ==='
            flutter doctor -v
          } > "$LOG_DIR/90-environment-diagnostics.log" 2>&1

          project_dir="${{ steps.project.outputs.dir }}"
          if [[ -n "$project_dir" && -d "$project_dir" ]]; then
            cp "$project_dir/pubspec.yaml" "$LOG_DIR/pubspec.yaml" 2>/dev/null || true
            cp "$project_dir/pubspec.lock" "$LOG_DIR/pubspec.lock" 2>/dev/null || true
            cp "$project_dir/android/gradle.properties" "$LOG_DIR/gradle.properties" 2>/dev/null || true
            cp "$project_dir/android/gradle/wrapper/gradle-wrapper.properties" \
              "$LOG_DIR/gradle-wrapper.properties" 2>/dev/null || true

            if [[ -d "$project_dir/build/app/outputs/logs" ]]; then
              cp -R "$project_dir/build/app/outputs/logs" \
                "$LOG_DIR/android-build-logs" 2>/dev/null || true
            fi

            find "$project_dir/build" -maxdepth 8 -type f \
              \( -iname '*.log' -o -iname '*.txt' -o -iname '*report*' \) \
              -print 2>/dev/null \
              > "$LOG_DIR/91-detected-build-log-files.txt" || true
          fi

          find "$LOG_DIR" -maxdepth 3 -type f -printf '%P\n' | sort \
            > "$LOG_DIR/99-log-index.txt" || true

      - name: Upload error logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foroshino-error-logs-run-${{ github.run_number }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn
          retention-days: 30
